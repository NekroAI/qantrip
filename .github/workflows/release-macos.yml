name: Release macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: 核心测试
        run: cargo test --manifest-path core/Cargo.toml
      - name: 导入发布签名证书
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: 打包 ${{ matrix.arch }}
        run: |
          # 发布版本必须使用发布证书（docs/decisions.md D1 / D22），不能退回开发证书
          test "$SIGN_IDENTITY" = "Nekro Qantrip Release"
          ARCH=${{ matrix.arch }} scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qantrip-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 固定文件名的副本：官网直链 releases/latest/download/Qantrip-macOS-<arch>.dmg 始终指向最新版本
          for arch in arm64 x86_64; do cp dmgs/Qantrip-*-"$arch".dmg "dmgs/Qantrip-macOS-$arch.dmg"; done
          (cd dmgs && sha256sum *.dmg > SHA256SUMS.txt)
          # 不标记为预发布：GitHub 的 releases/latest 不包含预发布版本
          gh release create "$GITHUB_REF_NAME" dmgs/*.dmg dmgs/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nekro Qantrip $GITHUB_REF_NAME" \
            --notes-file docs/install-macos.md \
            --latest
