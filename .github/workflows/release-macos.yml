name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: 核心测试
        run: cargo test --manifest-path core/Cargo.toml
      - name: 导入发布签名证书
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: 打包 ${{ matrix.arch }}
        run: |
          # 发布版本必须使用发布证书（docs/decisions.md D1 / D22），不能退回开发证书
          test "$SIGN_IDENTITY" = "Nekro Qantrip Release"
          ARCH=${{ matrix.arch }} scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qantrip-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: error

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rust 工具链
        run: rustup toolchain install stable --profile minimal
      - name: 打包 Windows x64
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = (Get-Content VERSION -Raw).Trim()
          Copy-Item dist\windows\Qantrip-Windows-x64.zip "dist\windows\Qantrip-$v-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: qantrip-windows-x64
          path: dist/windows/Qantrip-*-Windows-x64.zip
          if-no-files-found: error

  release:
    needs: [package, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 固定文件名的副本：官网直链 releases/latest/download/Qantrip-macOS-<arch>.dmg 始终指向最新版本
          for arch in arm64 x86_64; do cp assets/Qantrip-*-"$arch".dmg "assets/Qantrip-macOS-$arch.dmg"; done
          cp assets/Qantrip-*-Windows-x64.zip assets/Qantrip-Windows-x64.zip
          (cd assets && sha256sum *.dmg *.zip > SHA256SUMS.txt)
          # 不标记为预发布：GitHub 的 releases/latest 不包含预发布版本
          gh release create "$GITHUB_REF_NAME" assets/*.dmg assets/*.zip assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nekro Qantrip $GITHUB_REF_NAME" \
            --notes-file docs/install.md \
            --latest
