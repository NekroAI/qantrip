name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: 核心测试
        run: cargo test --manifest-path core/Cargo.toml
      - name: 导入发布签名证书
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: 安装 dmgbuild（DMG 安装窗口布局）
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: 打包 ${{ matrix.arch }}
        run: |
          # 发布版本必须使用发布证书（docs/decisions.md D1 / D22），不能退回开发证书
          test "$SIGN_IDENTITY" = "Nekro Qantrip Release"
          ARCH=${{ matrix.arch }} scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qantrip-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: error

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rust 工具链
        run: rustup toolchain install stable --profile minimal
      - name: 安装 Inno Setup（安装程序）
        run: choco install innosetup -y --no-progress
      - name: 打包 Windows x64
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 发布必须同时有安装程序与 zip
          if (-not (Test-Path dist\windows\Qantrip-Windows-x64-Setup.exe)) { throw "没有生成安装程序" }
          # 发布文件名带版本号（docs/decisions.md D38）
          $v = (Get-Content VERSION -Raw).Trim()
          Move-Item dist\windows\Qantrip-Windows-x64.zip "dist\windows\Qantrip-$v-Windows-x64.zip"
          Move-Item dist\windows\Qantrip-Windows-x64-Setup.exe "dist\windows\Qantrip-$v-Windows-x64-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: qantrip-windows-x64
          path: |
            dist/windows/Qantrip-*-Windows-x64.zip
            dist/windows/Qantrip-*-Windows-x64-Setup.exe
          if-no-files-found: error

  package-linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: 构建依赖（GTK 4.14 / libadwaita 1.5，Ubuntu 24.04 为最低支持版本）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libfontconfig-dev rpm imagemagick desktop-file-utils file
      - name: Rust 工具链
        run: rustup toolchain install stable --profile minimal
      - name: 测试
        run: |
          cargo test --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path apps/linux/Cargo.toml
      - name: 打包 Linux ${{ matrix.arch }}（AppImage、deb、rpm）
        run: |
          scripts/package-linux.sh
          v=$(tr -d '[:space:]' < VERSION)
          # 发布必须同时有三种包
          for ext in AppImage deb rpm; do test -s "dist/linux/Qantrip-$v-Linux-${{ matrix.arch }}.$ext"; done
      - uses: actions/upload-artifact@v4
        with:
          name: qantrip-linux-${{ matrix.arch }}
          path: |
            dist/linux/Qantrip-*-Linux-*.AppImage
            dist/linux/Qantrip-*-Linux-*.deb
            dist/linux/Qantrip-*-Linux-*.rpm
          if-no-files-found: error

  release:
    needs: [package, package-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 每个安装包只有一个文件：Qantrip-<版本>-<系统>-<arm64|x64>.<扩展名>（docs/decisions.md D38）。
          # 固定地址由官网 qantrip.nekro.ai/dl/<平台> 跳转到最新版本，不再上传无版本号的副本。
          v=$(tr -d '[:space:]' < VERSION)
          for f in macOS-arm64.dmg macOS-x64.dmg Windows-x64-Setup.exe Windows-x64.zip \
                   Linux-x64.AppImage Linux-x64.deb Linux-x64.rpm Linux-arm64.AppImage Linux-arm64.deb Linux-arm64.rpm; do
            test -s "assets/Qantrip-$v-$f"
          done
          test "$(ls assets | wc -l)" -eq 10
          chmod +x assets/*.AppImage
          (cd assets && sha256sum *.dmg *.zip *.exe *.AppImage *.deb *.rpm > SHA256SUMS.txt)
          # 不标记为预发布：GitHub 的 releases/latest 不包含预发布版本
          gh release create "$GITHUB_REF_NAME" assets/*.dmg assets/*.zip assets/*.exe assets/*.AppImage assets/*.deb assets/*.rpm assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nekro Qantrip $GITHUB_REF_NAME" \
            --notes-file docs/install.md \
            --latest
