[package]
name = "qantrip-core"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "qantrip_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
minijinja = { version = "3", features = ["fuel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
similar = "3.2.0"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
